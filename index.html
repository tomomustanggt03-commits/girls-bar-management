<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガールズバー経営管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;margin:0;background:#f6f8fb;color:#172033}button,input{font:inherit}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#fff;padding:20px;border-right:1px solid #e4e9f0}.nav{display:block;width:100%;padding:11px;margin:5px 0;border:0;border-radius:9px;background:#fff;text-align:left;font-weight:700}.nav.active{background:#eaf3ff;color:#1677ff}.main{padding:24px}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid #e4e9f0;border-radius:14px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d7dee8;border-radius:9px}.primary{background:#1677ff;color:#fff;border:0;padding:11px 16px;border-radius:9px;font-weight:800}.red{color:#ef2b2d}.green{color:#16a05d}.blue{color:#1677ff}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e4e9f0;text-align:right}th:first-child,td:first-child{text-align:left}.login{position:fixed;inset:0;background:#f6f8fb;z-index:9;display:flex;align-items:center;justify-content:center}.login .card{width:360px}.login input{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px}@media(max-width:700px){.shell{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:1fr}}</style></head><body>
<div id="auth" class="login"><div class="card"><h2>🥂 ログイン</h2><input id="loginId" placeholder="ログインID"><input id="loginPassword" type="password" placeholder="パスワード"><button id="loginBtn" class="primary">ログイン</button><div id="loginMsg" class="red"></div></div></div>
<div class="shell"><aside class="side"><h2>🥂 ガールズバー</h2><small>経営管理アプリ</small><hr><button class="nav active" data-page="dash">ダッシュボード</button><button class="nav" data-page="daily">売上入力</button><button class="nav" data-page="staff">バック計算・給与</button><button class="nav" data-page="fixed">固定費</button><button class="nav" data-page="variable">変動費</button><button class="nav" data-page="expenses">経費管理</button></aside><main class="main">
<section id="dash" class="page active"><h1>ダッシュボード</h1><div class="grid"><div class="card"><b>本日の売上</b><h2 id="todaySales" class="blue">¥0</h2></div><div class="card"><b>本日の経費</b><h2 id="todayCost" class="red">¥0</h2></div><div class="card"><b>本日の利益</b><h2 id="todayProfit" class="green">¥0</h2></div><div class="card"><b>本日の来客数</b><h2 id="todayGuests">0名</h2></div></div></section>
<section id="daily" class="page"><h1>売上入力</h1><div class="card"><div class="grid"><div class="field"><label>日付</label><input id="dDate" type="date"></div><div class="field"><label>来客数</label><input id="dGuests" type="number" value="0"></div><div class="field"><label>セット売上</label><input id="dSet" type="number" value="0"></div><div class="field"><label>ドリンク売上</label><input id="dDrink" type="number" value="0"></div><div class="field"><label>シャンパン売上</label><input id="dChamp" type="number" value="0"></div><div class="field"><label>指名・同伴等</label><input id="dNom" type="number" value="0"></div><div class="field"><label>その他売上</label><input id="dOther" type="number" value="0"></div></div><button class="primary" onclick="addDaily()">保存</button></div></section>
<section id="staff" class="page"><h1>バック計算・給与</h1><div class="card"><div class="grid"><div class="field"><label>日付</label><input id="sDate" type="date"></div><div class="field"><label>キャスト名</label><input id="sName"></div><div class="field"><label>勤務時間</label><input id="sHours" type="number" step=".5" value="0"></div><div class="field"><label>時給</label><input id="sWage" type="number" value="1750"></div><div class="field"><label>ドリンクバック（100円単位）</label><input id="sDrinkBack" type="number" step="100" value="0"></div><div class="field"><label>シャンパン売上（100円単位）</label><input id="sChampSales" type="number" step="100" value="0"></div><div class="field"><label>その他バック</label><input id="sOtherBack" type="number" value="0"></div><div class="field"><label>控除</label><input id="sDeduct" type="number" value="0"></div></div><button class="primary" onclick="addStaff()">保存</button></div></section>
<section id="fixed" class="page"><h1>固定費</h1><div class="card"><table><tbody id="fixedRows"></tbody></table><button class="primary" onclick="saveFixed()">固定費を保存</button><h3>合計 <span id="fixedTotal" class="red">¥0</span></h3></div></section>
<section id="variable" class="page"><h1>変動費</h1><div class="card"><div class="field"><label>対象月</label><input id="variableMonth" type="month" onchange="render()"></div><h3>変動費の項目</h3><table><thead><tr><th>項目</th><th>金額</th></tr></thead><tbody><tr><td>キャスト経費（実績）</td><td id="vCast">¥0</td></tr><tr><td>電気・水道</td><td><input id="vUtility" type="number" step="100" value="0"></td></tr><tr><td>酒・ドリンク仕入</td><td><input id="vLiquor" type="number" step="100" value="0"></td></tr><tr><td>雑費</td><td><input id="vMisc" type="number" step="100" value="0"></td></tr></tbody></table><button class="primary" onclick="saveVariable()">変動費を保存</button><h3>変動費 合計 <span id="vTotal" class="red">¥0</span></h3><small>キャスト経費（実績）はバック計算・給与から自動集計されます。</small></div></section>
<section id="expenses" class="page"><h1>経費管理</h1><div class="card"><table><tbody id="expenseRows"></tbody></table></div></section>
</main></div><script>
const CHAMP=.1,def={internalStaff:0,rent:181500,karaoke:42000,towel:10000,comm:8000,poke:33000,indeed:0,chocolat:0,tax:57700,other:0};let state=JSON.parse(localStorage.getItem('girlsbar_state')||'null')||{daily:[],staff:[],plan:def,variable:{}};state.daily=state.daily||[];state.staff=state.staff||[];state.plan=state.plan||def;state.variable=state.variable||{};const yen=n=>'¥'+Math.round(+n||0).toLocaleString('ja-JP');const date=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const month=()=>date().slice(0,7);function persist(){localStorage.setItem('girlsbar_state',JSON.stringify(state));render()}
(async()=>{try{let r=await fetch('/api/session');if(r.ok)auth.style.display='none'}catch(e){}loginBtn.onclick=async()=>{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:loginId.value,password:loginPassword.value})});if(r.ok)auth.style.display='none';else loginMsg.textContent='IDまたはパスワードが違います'}})();document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active')});
function addDaily(){let r={id:Date.now(),date:dDate.value||date(),guests:+dGuests.value,set:+dSet.value,drink:+dDrink.value,champ:+dChamp.value,nom:+dNom.value,other:+dOther.value};r.sales=r.set+r.drink+r.champ+r.nom+r.other;state.daily=state.daily.filter(x=>x.date!==r.date);state.daily.unshift(r);persist()}function addStaff(){let cs=Math.round((+sChampSales.value||0)/100)*100,db=Math.round((+sDrinkBack.value||0)/100)*100,r={id:Date.now(),date:sDate.value||date(),name:sName.value||'未入力',hours:+sHours.value,wage:+sWage.value,drinkBack:db,champSales:cs,otherBack:+sOtherBack.value,deduct:+sDeduct.value};r.hourPay=r.hours*r.wage;r.champBack=cs*CHAMP;r.pay=r.hourPay+r.drinkBack+r.champBack+r.otherBack-r.deduct;state.staff.unshift(r);persist()}
const fixedKeys=[['人件費（内勤スタッフ）','internalStaff'],['家賃','rent'],['カラオケ','karaoke'],['おしぼり','towel'],['通信費','comm'],['ポケパラ','poke'],['インディード（女性求人）','indeed'],['ショコラ（女性求人）','chocolat'],['税理士','tax'],['その他固定費','other']];function saveFixed(){fixedKeys.forEach(x=>state.plan[x[1]]=+document.querySelector('[data-k="'+x[1]+'"]').value||0);persist()}function saveVariable(){let k=variableMonth.value||month();state.variable[k]={utility:+vUtility.value||0,liquor:+vLiquor.value||0,misc:+vMisc.value||0};persist()}
function render(){let td=state.daily.find(x=>x.date===date()),ts=state.staff.filter(x=>x.date===date()),sales=td?td.sales:0,castToday=ts.reduce((s,x)=>s+(+x.pay||0),0);todaySales.textContent=yen(sales);todayCost.textContent=yen(castToday);todayProfit.textContent=yen(sales-castToday);todayGuests.textContent=(td?td.guests:0)+'名';fixedRows.innerHTML=fixedKeys.map(x=>'<tr><td>'+x[0]+'</td><td><input data-k="'+x[1]+'" type="number" step="100" value="'+(+state.plan[x[1]]||0)+'"></td></tr>').join('');fixedTotal.textContent=yen(fixedKeys.reduce((s,x)=>s+(+state.plan[x[1]]||0),0));let k=variableMonth.value||month(),cast=state.staff.filter(x=>x.date.slice(0,7)===k).reduce((s,x)=>s+(+x.pay||0),0),v=state.variable[k]||{utility:0,liquor:0,misc:0};vCast.textContent=yen(cast);vUtility.value=v.utility||0;vLiquor.value=v.liquor||0;vMisc.value=v.misc||0;vTotal.textContent=yen(cast+(+v.utility||0)+(+v.liquor||0)+(+v.misc||0));expenseRows.innerHTML='<tr><td>キャスト経費（実績）</td><td>'+yen(cast)+'</td></tr><tr><td>電気・水道</td><td>'+yen(v.utility)+'</td></tr><tr><td>酒・ドリンク仕入</td><td>'+yen(v.liquor)+'</td></tr><tr><td>雑費</td><td>'+yen(v.misc)+'</td></tr>'}dDate.value=date();sDate.value=date();variableMonth.value=month();render();
</script></body></html>
