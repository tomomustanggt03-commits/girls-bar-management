<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ガールズバー経営管理</title>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--panel2:#17223d;--line:#263456;--text:#f8fafc;--muted:#9fb0ce;--accent:#8b5cf6;--accent2:#22c55e;--danger:#ef4444;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text)}.app{max-width:1180px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.tab{background:#1f2a44;color:#cbd5e1}.tab.active{background:var(--accent);color:white}.primary{background:var(--accent);color:white}.secondary{background:#25314f;color:white}.danger{background:#7f1d1d;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:rgba(18,26,47,.95);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-size:26px;font-weight:800;margin-top:7px}.section{display:none}.section.active{display:block}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:#cbd5e1;background:#16213a;position:sticky;top:0}.scroll{overflow:auto;max-height:460px;border-radius:12px}.good{color:#86efac}.bad{color:#fca5a5}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:140px}.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}.bar{height:12px;background:#23304d;border-radius:999px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#22c55e)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.app{padding:12px}.kpi .value{font-size:21px}}
</style></head><body>
<div id="authOverlay" style="position:fixed;inset:0;background:#0b1020;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px"><div style="width:min(420px,100%);background:#121a2f;border:1px solid #263456;border-radius:20px;padding:24px;color:#f8fafc"><h2 style="margin-top:0">ログイン</h2><div style="color:#9fb0ce;font-size:13px;margin-bottom:18px">ガールズバー経営管理</div><label>ログインID</label><input id="loginId" autocomplete="username"><label>パスワード</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="loginBtn" style="width:100%;margin-top:14px;background:#8b5cf6;color:white">ログイン</button><div id="loginMsg" style="color:#fca5a5;font-size:12px;margin-top:10px;min-height:18px"></div></div></div>
<script>(async function(){const overlay=document.getElementById('authOverlay');async function check(){try{const r=await fetch('/api/session',{credentials:'same-origin'});if(r.ok){overlay.style.display='none';return true}}catch(e){}overlay.style.display='flex';return false}await check();document.getElementById('loginBtn').addEventListener('click',async()=>{const id=document.getElementById('loginId').value,password=document.getElementById('loginPassword').value,msg=document.getElementById('loginMsg');msg.textContent='確認中...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password}),credentials:'same-origin'});if(r.ok){msg.textContent='';overlay.style.display='none'}else msg.textContent='IDまたはパスワードが違います'}catch(e){msg.textContent='ログインに失敗しました'}})})();</script>
<div class="app"><header><div><h1>ガールズバー経営管理</h1><div class="sub">売上・経費・人件費・シャンパンバックを一括管理</div></div><button class="secondary" onclick="exportData()">バックアップ</button></header><div class="tabs"><button class="tab active" data-tab="dash">ダッシュボード</button><button class="tab" data-tab="daily">日次入力</button><button class="tab" data-tab="staff">キャスト給与</button><button class="tab" data-tab="plan">収支計画</button></div>
<section id="dash" class="section active"><div class="grid"><div class="card kpi"><div class="label">今月売上</div><div id="kSales" class="value">¥0</div></div><div class="card kpi"><div class="label">今月経費</div><div id="kCost" class="value">¥0</div></div><div class="card kpi"><div class="label">今月利益</div><div id="kProfit" class="value">¥0</div></div><div class="card kpi"><div class="label">利益率</div><div id="kMargin" class="value">0%</div></div></div><div class="two" style="margin-top:14px"><div class="card"><h3>売上構成</h3><div id="salesBreakdown"></div></div><div class="card"><h3>経営目標</h3><div class="muted">月間売上目標</div><div style="font-size:28px;font-weight:800;margin-top:6px" id="goalText">¥2,500,000</div><div class="bar"><i id="goalBar" style="width:0%"></i></div><div class="note" id="goalNote"></div></div></div></section>
<section id="daily" class="section"><div class="card"><h3>日次売上を入力</h3><div class="formgrid"><div><label>日付</label><input id="dDate" type="date"></div><div><label>来客数</label><input id="dGuests" type="number" min="0" value="0"></div><div><label>セット売上</label><input id="dSet" type="number" min="0" value="0"></div><div><label>ドリンク売上</label><input id="dDrink" type="number" min="0" value="0"></div><div><label>シャンパン売上</label><input id="dChamp" type="number" min="0" value="0"></div><div><label>指名・同伴等</label><input id="dNom" type="number" min="0" value="0"></div><div><label>その他売上</label><input id="dOther" type="number" min="0" value="0"></div><div><label>仕入・その他変動費</label><input id="dVar" type="number" min="0" value="0"></div></div><div style="margin-top:12px"><button class="primary" onclick="addDaily()">保存</button></div><div class="note">シャンパンバックは自動で10％計算されます。</div></div><div class="card" style="margin-top:14px"><h3>日次履歴</h3><div class="scroll"><table><thead><tr><th>日付</th><th>売上</th><th>来客</th><th>シャンパン</th><th>バック</th><th>変動費</th><th></th></tr></thead><tbody id="dailyRows"></tbody></table></div></div></section>
<section id="staff" class="section"><div class="card"><h3>キャスト給与</h3><div class="formgrid"><div><label>日付</label><input id="sDate" type="date"></div><div><label>キャスト名</label><input id="sName" placeholder="例：あい"></div><div><label>勤務時間</label><input id="sHours" type="number" step="0.5" min="0" value="0"></div><div><label>時給</label><input id="sWage" type="number" min="0" value="1750"></div><div><label>ドリンクバック</label><input id="sDrinkBack" type="number" min="0" value="0"></div><div><label>シャンパン売上</label><input id="sChampSales" type="number" min="0" value="0"></div><div><label>その他バック</label><input id="sOtherBack" type="number" min="0" value="0"></div><div><label>控除</label><input id="sDeduct" type="number" min="0" value="0"></div></div><div style="margin-top:12px"><button class="primary" onclick="addStaff()">保存</button></div></div><div class="card" style="margin-top:14px"><h3>給与履歴</h3><div class="scroll"><table><thead><tr><th>日付</th><th>名前</th><th>時給給与</th><th>シャンパンバック</th><th>支給額</th><th></th></tr></thead><tbody id="staffRows"></tbody></table></div></div></section>
<section id="plan" class="section"><div class="two"><div class="card"><h3>月間収支計画</h3><div class="formgrid"><div><label>売上目標</label><input id="pSales" type="number" value="2500000"></div><div><label>人件費</label><input id="pLabor" type="number" value="1050000"></div><div><label>家賃</label><input id="pRent" type="number" value="181500"></div><div><label>カラオケ</label><input id="pKaraoke" type="number" value="42000"></div><div><label>おしぼり</label><input id="pTowel" type="number" value="10000"></div><div><label>電気・水道</label><input id="pUtility" type="number" value="25000"></div><div><label>通信費</label><input id="pComm" type="number" value="8000"></div><div><label>ポケパラ</label><input id="pPoke" type="number" value="33000"></div><div><label>インディード（女性求人）</label><input id="pIndeed" type="number" value="0"></div><div><label>ショコラ（女性求人）</label><input id="pChocolat" type="number" value="0"></div><div><label>税理士</label><input id="pTax" type="number" value="57700"></div><div><label>その他固定費</label><input id="pOther" type="number" value="0"></div></div><div style="margin-top:12px"><button class="primary" onclick="savePlan()">計画を保存</button></div></div><div class="card"><h3>営業条件</h3><div class="formgrid"><div><label>営業日数</label><input id="pDays" type="number" value="24"></div><div><label>平均時給</label><input id="pAvgWage" type="number" value="1750"></div><div><label>火〜木 人数</label><input id="pWeekdayPeople" type="number" value="3"></div><div><label>火〜木 営業時間</label><input id="pWeekdayHours" type="number" value="6"></div><div><label>金〜日 人数</label><input id="pWeekendPeople" type="number" value="4"></div><div><label>金〜日 営業時間</label><input id="pWeekendHours" type="number" value="8"></div></div><div id="planCalc" style="margin-top:16px"></div></div></div></section></div>
<script>const CHAMP_RATE=.10;const defaultPlan={sales:2500000,labor:1050000,rent:181500,karaoke:42000,towel:10000,utility:25000,comm:8000,poke:33000,indeed:0,chocolat:0,tax:57700,other:0,days:24,avgWage:1750,weekdayPeople:3,weekdayHours:6,weekendPeople:4,weekendHours:8};let state=JSON.parse(localStorage.getItem('girlsbar_state')||'null')||{daily:[],staff:[],plan:defaultPlan};const yen=n=>'¥'+Math.round(Number(n||0)).toLocaleString('ja-JP'),pct=n=>(Number(n||0)*100).toFixed(1)+'%';function save(){localStorage.setItem('girlsbar_state',JSON.stringify(state));render()}function monthKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}function currentKey(){return monthKey(new Date())}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});function addDaily(){const rec={id:Date.now(),date:dDate.value||new Date().toISOString().slice(0,10),guests:+dGuests.value,set:+dSet.value,drink:+dDrink.value,champ:+dChamp.value,nom:+dNom.value,other:+dOther.value,varcost:+dVar.value};rec.sales=rec.set+rec.drink+rec.champ+rec.nom+rec.other;rec.champBack=rec.champ*CHAMP_RATE;state.daily.unshift(rec);save()}function addStaff(){const champSales=+sChampSales.value;const rec={id:Date.now(),date:sDate.value||new Date().toISOString().slice(0,10),name:sName.value||'未入力',hours:+sHours.value,wage:+sWage.value,drinkBack:+sDrinkBack.value,champSales,otherBack:+sOtherBack.value,deduct:+sDeduct.value};rec.hourPay=rec.hours*rec.wage;rec.champBack=champSales*CHAMP_RATE;rec.pay=rec.hourPay+rec.drinkBack+rec.champBack+rec.otherBack-rec.deduct;state.staff.unshift(rec);save()}function delDaily(id){state.daily=state.daily.filter(x=>x.id!==id);save()}function delStaff(id){state.staff=state.staff.filter(x=>x.id!==id);save()}function savePlan(){state.plan={sales:+pSales.value,labor:+pLabor.value,rent:+pRent.value,karaoke:+pKaraoke.value,towel:+pTowel.value,utility:+pUtility.value,comm:+pComm.value,poke:+pPoke.value,indeed:+pIndeed.value,chocolat:+pChocolat.value,tax:+pTax.value,other:+pOther.value,days:+pDays.value,avgWage:+pAvgWage.value,weekdayPeople:+pWeekdayPeople.value,weekdayHours:+pWeekdayHours.value,weekendPeople:+pWeekendPeople.value,weekendHours:+pWeekendHours.value};save()}function loadPlan(){const p=state.plan||defaultPlan;[['pSales','sales'],['pLabor','labor'],['pRent','rent'],['pKaraoke','karaoke'],['pTowel','towel'],['pUtility','utility'],['pComm','comm'],['pPoke','poke'],['pIndeed','indeed'],['pChocolat','chocolat'],['pTax','tax'],['pOther','other'],['pDays','days'],['pAvgWage','avgWage'],['pWeekdayPeople','weekdayPeople'],['pWeekdayHours','weekdayHours'],['pWeekendPeople','weekendPeople'],['pWeekendHours','weekendHours']].forEach(([id,k])=>document.getElementById(id).value=(p[k]??defaultPlan[k]??0))}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='girlsbar_backup.json';a.click();URL.revokeObjectURL(a.href)}function render(){const mk=currentKey(),ds=state.daily.filter(x=>monthKey(x.date)===mk),ss=state.staff.filter(x=>monthKey(x.date)===mk),sales=ds.reduce((a,x)=>a+x.sales,0),varcost=ds.reduce((a,x)=>a+x.varcost+x.champBack,0),payroll=ss.reduce((a,x)=>a+x.pay,0),p=state.plan||defaultPlan,fixed=(p.rent||0)+(p.karaoke||0)+(p.towel||0)+(p.utility||0)+(p.comm||0)+(p.poke||0)+(p.indeed||0)+(p.chocolat||0)+(p.tax||0)+(p.other||0),cost=varcost+payroll+fixed,profit=sales-cost;kSales.textContent=yen(sales);kCost.textContent=yen(cost);kProfit.textContent=yen(profit);kProfit.className='value '+(profit>=0?'good':'bad');kMargin.textContent=sales?pct(profit/sales):'0%';const champ=ds.reduce((a,x)=>a+x.champ,0),drink=ds.reduce((a,x)=>a+x.drink,0),setv=ds.reduce((a,x)=>a+x.set,0),other=ds.reduce((a,x)=>a+x.nom+x.other,0);salesBreakdown.innerHTML=[['セット',setv],['ドリンク',drink],['シャンパン',champ],['その他',other]].map(([n,v])=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>${n}</span><b>${yen(v)}</b></div><div class="bar"><i style="width:${sales?Math.min(100,v/sales*100):0}%"></i></div></div>`).join('');goalText.textContent=yen(p.sales);const prog=p.sales?sales/p.sales:0;goalBar.style.width=Math.min(100,prog*100)+'%';goalNote.textContent=`進捗 ${pct(prog)} ／ 残り ${yen(Math.max(0,p.sales-sales))}`;dailyRows.innerHTML=state.daily.map(x=>`<tr><td>${x.date}</td><td>${yen(x.sales)}</td><td>${x.guests}</td><td>${yen(x.champ)}</td><td>${yen(x.champBack)}</td><td>${yen(x.varcost)}</td><td><button class="danger" onclick="delDaily(${x.id})">削除</button></td></tr>`).join('');staffRows.innerHTML=state.staff.map(x=>`<tr><td>${x.date}</td><td>${x.name}</td><td>${yen(x.hourPay)}</td><td>${yen(x.champBack)}</td><td>${yen(x.pay)}</td><td><button class="danger" onclick="delStaff(${x.id})">削除</button></td></tr>`).join('');const calcLabor=(p.weekdayPeople*p.weekdayHours*3+p.weekendPeople*p.weekendHours*3)*4*p.avgWage,baseCost=p.labor+fixed,planProfit=p.sales-baseCost;planCalc.innerHTML=`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="label">日売上目標</div><div class="value">${yen(p.sales/p.days)}</div></div><div class="kpi"><div class="label">計算上の月人件費</div><div class="value">${yen(calcLabor)}</div></div><div class="kpi"><div class="label">計画経費</div><div class="value">${yen(baseCost)}</div></div><div class="kpi"><div class="label">計画利益</div><div class="value ${planProfit>=0?'good':'bad'}">${yen(planProfit)}</div></div></div>`}document.getElementById('dDate').value=new Date().toISOString().slice(0,10);document.getElementById('sDate').value=new Date().toISOString().slice(0,10);loadPlan();render();</script></body></html>
