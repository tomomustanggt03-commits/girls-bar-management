<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ガールズバー経営管理</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fb}#app{width:100%;height:100%;border:0;display:block;background:#f6f8fb}</style>
</head>
<body>
<iframe id="app" src="/index.html?v=sync1" allow="same-origin"></iframe>
<script>
(function(){
  const KEY='girlsbar_state';
  const frame=document.getElementById('app');
  let ready=false,lastLocal=null,lastCloud=null,busy=false;

  function readLocal(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function parse(raw){try{return raw?JSON.parse(raw):null}catch(e){return null}}
  function score(s){
    if(!s||typeof s!=='object')return 0;
    let n=0;
    if(Array.isArray(s.daily)){n+=s.daily.length*100;s.daily.forEach(x=>{n+=(+x.sales||0)/1000;n+=(+x.guests||0)})}
    if(Array.isArray(s.staff))n+=s.staff.length*100;
    if(s.castSettings)n+=Object.keys(s.castSettings).length*20;
    if(s.variable)n+=Object.keys(s.variable).length*20;
    if(s.plan)n+=Object.values(s.plan).reduce((a,v)=>a+(+v||0),0)/10000;
    return n;
  }
  function writeLocal(raw){try{localStorage.setItem(KEY,raw)}catch(e){}}
  function reloadApp(){try{frame.contentWindow.location.reload()}catch(e){frame.src='/index.html?v='+Date.now()}}

  async function getCloud(){
    const r=await fetch('/api/state',{credentials:'include',cache:'no-store'});
    if(r.status===401)return {auth:false};
    if(!r.ok)throw new Error('GET /api/state '+r.status);
    const j=await r.json();
    return {auth:true,data:j.data||null};
  }
  async function putCloud(obj){
    const r=await fetch('/api/state',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:obj})});
    if(!r.ok)throw new Error('PUT /api/state '+r.status);
  }

  async function tick(){
    if(busy)return;
    busy=true;
    try{
      const c=await getCloud();
      if(!c.auth)return;
      const localRaw=readLocal();
      const localObj=parse(localRaw);
      const cloudObj=c.data;
      const cloudRaw=cloudObj?JSON.stringify(cloudObj):null;

      if(!ready){
        if(cloudObj&&localObj&&cloudRaw!==localRaw){
          if(score(localObj)>=score(cloudObj)){
            await putCloud(localObj);lastCloud=JSON.stringify(localObj);lastLocal=localRaw;
          }else{
            writeLocal(cloudRaw);lastCloud=cloudRaw;lastLocal=cloudRaw;reloadApp();
          }
        }else if(cloudObj&&!localObj){
          writeLocal(cloudRaw);lastCloud=cloudRaw;lastLocal=cloudRaw;reloadApp();
        }else if(!cloudObj&&localObj){
          await putCloud(localObj);lastCloud=localRaw;lastLocal=localRaw;
        }else{
          lastCloud=cloudRaw;lastLocal=localRaw;
        }
        ready=true;
        return;
      }

      if(localRaw&&localRaw!==lastLocal){
        const obj=parse(localRaw);if(obj){await putCloud(obj);lastLocal=localRaw;lastCloud=localRaw;}
        return;
      }
      if(cloudRaw&&cloudRaw!==lastCloud){
        writeLocal(cloudRaw);lastCloud=cloudRaw;lastLocal=cloudRaw;reloadApp();
      }
    }catch(e){console.warn('cloud sync wrapper',e)}finally{busy=false}
  }

  window.addEventListener('storage',()=>setTimeout(tick,50));
  window.addEventListener('focus',tick);
  setInterval(tick,2500);
  setTimeout(tick,800);
})();
</script>
</body>
</html>
