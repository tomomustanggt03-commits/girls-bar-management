<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガールズバー経営管理</title></head><body><div style="font-family:sans-serif;padding:24px">同期版を読み込み中...</div><script>
(async()=>{
  try{
    let html=await fetch('/index.html?cloud='+Date.now(),{cache:'no-store'}).then(r=>r.text());
    const diag=`<div id="cloudDiag" style="position:fixed;right:10px;bottom:10px;z-index:100000;background:#111;color:#fff;padding:10px 12px;border-radius:9px;font:12px sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)">同期API: 確認中...</div>`;
    const probe=`<script>(function(){async function p(){var d=document.getElementById('cloudDiag');try{var r=await fetch('/api/state?probe='+Date.now(),{credentials:'same-origin',cache:'no-store'});if(d)d.textContent='同期API: HTTP '+r.status+(r.ok?' OK':'');}catch(e){if(d)d.textContent='同期API: 通信失敗';}}window.addEventListener('load',function(){setTimeout(p,300);setTimeout(p,1800);var b=document.getElementById('loginBtn');if(b)b.addEventListener('click',function(){setTimeout(p,1200);});});setInterval(p,8000);})();<\/script><script src="/sync.js?v=${Date.now()}"><\/script>`;
    html=html.replace('<body>','<body>'+diag);
    html=html.replace('データはブラウザ内に保存されます','データはPC・スマホで共通保存されます');
    html=html.replace('</body>',probe+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="font-family:sans-serif;padding:24px;color:#c00">同期版の読み込みに失敗しました。通常版をご利用ください。<br>'+String(e)+'</div>'}
})();
</script></body></html>
